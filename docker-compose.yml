version: '3.8'

services:
  alfonso-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfonso_autonomo_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ALFONSO_ENV=production
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=8765
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
