name: Alfonso Autónomo CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  compliance-and-tests:
    name: Homologación Fiscal, Integridad Criptográfica y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov flake8

      - name: Verificación Sintáctica y Linting
        run: |
          # Detener el build si hay errores sintácticos de Python o nombres no definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Suite de Homologación Fiscal Veri*Factu (Orden HAC/1177/2024)
        run: |
          python -m pytest tests/test_phase1_compliance_suite.py -v

      - name: Suite Contable PGC y Cierre de Ejercicio
        run: |
          python -m pytest tests/test_phase2_accounting_suite.py -v

      - name: Suite Factura B2B Ley Crea y Crece 18/2022 y Asesoría
        run: |
          python -m pytest tests/test_phase3_b2b_advisor_suite.py -v

      - name: Suite de Infraestructura, Migraciones y Logging
        run: |
          python -m pytest tests/test_phase4_infra_suite.py -v

      - name: Ejecución Integral de Tests del Proyecto (100% Cobertura de Suites)
        run: |
          python -m pytest tests/ -c tests/pytest.ini -v --durations=10
