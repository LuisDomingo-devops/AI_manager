<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Alfonso Aut&oacute;nomo</title>
</head>
<body>
    <div>Alfonso Autónomo</div>
    <input type="text" id="chat-input" placeholder="Escribe un comando...">
    <div id="output"></div>
    
    <script>
        const input = document.getElementById('chat-input');
        const output = document.getElementById('output');
        
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const text = input.value;
                if (text.toLowerCase().includes('modelo 303')) {
                    output.innerHTML += '<p>Guardián activado</p>';
                    output.innerHTML += '<p>Abriendo formulario: Modelo 303</p>';
                }
                input.value = '';
            }
        });
    </script>
</body>
</html>
